[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aicsec"
version = "0.1.0"
description = "Educational defensive AI cybersecurity toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "scikit-learn>=1.4.0",
  "numpy>=1.26.0",
]

[tool.setuptools.packages.find]
where = ["src"]
